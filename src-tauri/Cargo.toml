[package]
name = "codex-thread-studio"
version = "0.3.0"
edition = "2021"
license = "MIT"
default-run = "codex-thread-studio"

[[bin]]
name = "wayland-webview-prototype"
path = "src/bin/wayland-webview_prototype.rs"
required-features = ["wayland-webview-prototype"]

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-build", "dep:gtk", "dep:tao", "dep:webkit2gtk", "dep:wry", "dep:webview2-com"]
wayland-webview-prototype = ["desktop"]
windows-native = ["windows-sys/Win32_Security", "windows-sys/Win32_System_JobObjects", "windows-sys/Win32_System_Threading"]

[build-dependencies]
sha2 = "=0.11.0"
tauri-build = { version = "2.0.0", features = [], optional = true }

[dependencies]
marknoria = { path = "../crates/marknoria" }
studio-markdown-native = { path = "../crates/markdown-native" }
studio-svg-resources = { path = "../crates/svg-resources" }
notify = "8.2.0"
ignore = "=0.4.33"
axum = { version = "0.8.4", features = ["ws"] }
base64 = "0.22.1"
calamine = { version = "=0.38.0", default-features = false, features = ["dates"] }
csv = "1.4.0"
cssparser = "=0.27.2"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
gif = "=0.14.2"
resvg = { version = "=0.48.1", default-features = false, features = ["text", "system-fonts", "memmap-fonts"] }
dirs = "7.0.0"
futures-util = "0.3.31"
sse-stream = "=0.3.0"
regex = "1.13"
html5ever = "=0.26.0"
roxmltree = "=0.21.1"
percent-encoding = "2.3"
libc = "0.2.174"
portable-pty = "0.9.0"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "stream"] }
# Preserve checked u64/usize conversions used by persisted revisions/counts.
rusqlite = { version = "0.40.2", features = ["bundled", "fallible_uint", "functions", "hooks", "limits"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
tauri = { version = "2.0.0", features = ["unstable"], optional = true }
tokio = { version = "1.53.3", features = ["io-std", "io-util", "net", "process", "rt-multi-thread", "sync", "time"] }
uuid = { version = "1.23.5", features = ["v4"] }
tempfile = "3"
tokio-tungstenite = { version = "0.29.0", default-features = false, features = ["handshake"] }
url = "2.5.8"
zip = { version = "=9.0.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(target_os = "linux")'.dependencies]
pdfium-render = { version = "=0.9.4", default-features = false, features = ["pdfium_7881"] }
gtk = { version = "0.18.2", optional = true }
tao = { version = "0.37.0", optional = true }
webkit2gtk = { version = "2.0.1", optional = true }
wry = { version = "0.51.2", optional = true }

[target.'cfg(windows)'.dependencies]
tao = { version = "0.37.0", optional = true }
webview2-com = { version = "0.37", optional = true }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_DataExchange", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Ole", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
wry = { version = "0.51.2", optional = true }

[dev-dependencies]
tokio-tungstenite = "0.29"
tower = { version = "0.5.2", features = ["util"] }
