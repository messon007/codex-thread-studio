[package]
name = "studio-markdown-native"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Bounded Markdown blocks and source mappings for native widgets"

[features]
syntax-highlight = ["dep:syntect", "dep:two-face"]
structured-preview = ["dep:jsonc-parser", "dep:quick-xml"]

[[example]]
name = "syntax_notices"
required-features = ["syntax-highlight"]

[dependencies]
data-url = "=0.3.2"
base64 = "=0.23.1"
memchr = "=2.8.3"
unicase = "=2.10.0"
pulldown-cmark = { version = "0.13.6", default-features = false, features = ["simd"] }
serde = { version = "1", features = ["derive"] }
jsonc-parser = { version = "=0.34.0", optional = true, default-features = false }
quick-xml = { version = "=0.41.0", optional = true, default-features = false }
syntect = { version = "=5.3.0", optional = true, default-features = false, features = ["parsing", "default-themes", "regex-onig"] }
two-face = { version = "=0.5.2", optional = true, default-features = false, features = ["syntect-onig"] }
