<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        color-scheme: light;
        --text: #172033;
        --muted: #657086;
        --line: #dfe4ec;
        --soft: #f3f5f8;
        --active: #ffffff;
        --brand: #176b5d;
        --ui-font-family: "Noto Sans CJK SC", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
        --ui-font-size: 14px;
        --ui-font-weight: 500;
        --ui-font-emphasis: 600;
        --ui-font-compact: max(12px, calc(var(--ui-font-size) - 2px));
        --ui-font-label: max(11px, calc(var(--ui-font-size) - 3px));
        font-family: var(--ui-font-family);
        font-size: var(--ui-font-compact);
        font-weight: var(--ui-font-weight);
      }
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #fff; }
      body { display: grid; grid-template-rows: 32px 43px; border-bottom: 1px solid var(--line); }
      button, input { font: inherit; }
      button { cursor: pointer; }
      strong, b { font-weight: var(--ui-font-emphasis); }
      .tabs-row { display: flex; min-width: 0; align-items: end; gap: 4px; padding: 4px 10px 0; background: #f1f3f6; border-bottom: 1px solid var(--line); }
      .tabs { display: flex; min-width: 0; max-width: calc(100% - 68px); flex: 0 1 auto; align-items: end; gap: 3px; overflow: hidden; }
      .tab { display: flex; min-width: 78px; max-width: 190px; height: 27px; flex: 0 1 190px; align-items: center; gap: 6px; padding: 0 7px 0 10px; border: 1px solid transparent; border-bottom: 0; border-radius: 8px 8px 0 0; background: transparent; color: var(--muted); cursor: pointer; }
      .tab:hover { background: rgb(255 255 255 / 68%); color: var(--text); }
      .tab.active { background: var(--active); border-color: var(--line); color: var(--text); }
      .tab-title { min-width: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: left; font-size: var(--ui-font-compact); }
      .tab-close { width: 17px; height: 17px; padding: 0; border: 0; border-radius: 5px; background: transparent; color: #8992a3; line-height: 15px; }
      .tab-close:hover { background: #e4e7ec; color: #283246; }
      .new-tab { width: 27px; height: 27px; flex: 0 0 auto; margin-bottom: 1px; padding: 0; border: 0; border-radius: 7px; background: transparent; color: var(--muted); font-size: 18px; }
      .new-tab:hover { background: #e1e5eb; color: var(--text); }
      .workspace-close { width: 27px; height: 27px; flex: 0 0 auto; margin: 0 0 1px auto; padding: 0; border: 0; border-radius: 7px; background: transparent; color: var(--muted); font-size: 18px; line-height: 25px; }
      .workspace-close:hover { background: #e1e5eb; color: var(--text); }
      .toolbar { display: grid; grid-template-columns: auto minmax(100px, 1fr) auto; align-items: center; gap: 7px; padding: 0 10px; background: #fff; }
      .nav, .tools { display: flex; align-items: center; gap: 2px; }
      .icon { width: 31px; height: 31px; padding: 0; border: 0; border-radius: 8px; display: grid; place-items: center; background: transparent; color: var(--muted); font-size: 17px; line-height: 1; }
      .icon svg { width: 17px; height: 17px; display: block; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
      .icon:hover { background: var(--soft); color: var(--text); }
      .browser-menu { min-width: 35px; width: 35px; border: 1px solid #ccd4e0; background: #fff; font-size: var(--ui-font-compact); font-weight: var(--ui-font-emphasis); letter-spacing: -1px; }
      .browser-menu:hover { border-color: #aeb8c6; }
      .address { width: 100%; height: 34px; border: 1px solid #d4dae4; border-radius: 9px; outline: 0; background: #f7f8fa; color: var(--text); padding: 0 11px; }
      .address:focus { border-color: #7aa99f; box-shadow: 0 0 0 3px rgb(23 107 93 / 11%); background: white; }
      .zoom { min-width: 45px; width: auto; padding: 0 5px; font-size: var(--ui-font-label); }
      .fit.active { background: #e8f3f0; color: var(--brand); }
      .comment { height: 31px; border: 1px solid #ccd4e0; border-radius: 8px; background: white; color: #3d4960; padding: 0 9px; white-space: nowrap; font-size: var(--ui-font-compact); }
      .comment:hover { border-color: #8eb7ad; color: var(--brand); background: #f4f9f7; }
      .browser-panel { position: fixed; z-index: 2; right: 8px; top: 68px; display: none; width: min(340px, calc(100% - 16px)); max-height: calc(100% - 76px); overflow: auto; padding: 7px; border: 1px solid #d7dde6; border-radius: 10px; background: #fff; box-shadow: 0 12px 28px rgb(23 32 51 / 18%); color: var(--text); font-size: var(--ui-font-compact); }
      .browser-panel.open { display: block; }
      .browser-panel button { width: 100%; min-height: 31px; padding: 5px 8px; border: 0; border-radius: 7px; background: transparent; color: inherit; text-align: left; }
      .browser-panel button:hover { background: var(--soft); color: var(--brand); }
      .browser-panel hr { border: 0; border-top: 1px solid var(--line); margin: 5px 0; }
      .browser-panel h2 { margin: 4px 7px 7px; font-size: var(--ui-font-compact); }
      .browser-panel p { margin: 5px 7px; color: var(--muted); overflow-wrap: anywhere; }
      .download-item { padding: 7px; border-top: 1px solid var(--line); }
      .download-item:first-child { border-top: 0; }
      .download-item strong, .download-item span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .download-item span { margin-top: 2px; color: var(--muted); font-size: var(--ui-font-label); }
      @media (max-width: 620px) {
        .toolbar { gap: 4px; padding-inline: 6px; }
        .nav .icon:nth-child(2), .zoom-control { display: none; }
        .comment { width: 31px; padding: 0; font-size: 0; }
        .comment::before { content: "✎"; font-size: 15px; }
      }
    </style>
  </head>
  <body>
    <div class="tabs-row">
      <div id="tabs" class="tabs" role="tablist" aria-label="Browser tabs" data-i18n-aria-label="Browser tabs"></div>
      <button class="new-tab" data-action="new-tab" title="New tab (Ctrl+T)" aria-label="New tab" data-i18n-title="New tab (Ctrl+T)" data-i18n-aria-label="New tab">+</button>
      <button class="workspace-close" data-action="toggle-browser" title="Hide browser" aria-label="Hide browser" data-i18n-title="Hide browser" data-i18n-aria-label="Hide browser">×</button>
    </div>
    <div class="toolbar">
      <div class="nav">
        <button class="icon" data-action="back" title="Back" aria-label="Back" data-i18n-title="Back" data-i18n-aria-label="Back"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 6-6 6 6 6"/><path d="M9 12h9"/></svg></button>
        <button class="icon" data-action="forward" title="Forward" aria-label="Forward" data-i18n-title="Forward" data-i18n-aria-label="Forward"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/><path d="M15 12H6"/></svg></button>
        <button class="icon" data-action="reload" title="Reload" aria-label="Reload" data-i18n-title="Reload" data-i18n-aria-label="Reload"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 8a8 8 0 1 0 1 6"/><path d="M19 4v4h-4"/></svg></button>
      </div>
      <input id="address" class="address" value="https://example.com" spellcheck="false" aria-label="Address" data-i18n-aria-label="Address" />
      <div class="tools">
        <button class="icon zoom-control" data-action="zoom-out" title="Zoom out" aria-label="Zoom out" data-i18n-title="Zoom out" data-i18n-aria-label="Zoom out">−</button>
        <button id="zoom" class="icon zoom" data-action="zoom-reset" title="Reset to 100%" data-i18n-title="Reset to 100%">100%</button>
        <button class="icon zoom-control" data-action="zoom-in" title="Zoom in" aria-label="Zoom in" data-i18n-title="Zoom in" data-i18n-aria-label="Zoom in">+</button>
        <button id="fit" class="icon fit" data-action="fit-width" title="Fit page width" aria-label="Fit page width" data-i18n-title="Fit page width" data-i18n-aria-label="Fit page width">↔</button>
        <button id="comment" class="comment" type="button" data-i18n="Comment">Comment</button>
        <button class="icon browser-menu" data-action="browser-menu" title="More browser actions" aria-label="More browser actions" data-i18n-title="More browser actions" data-i18n-aria-label="More browser actions">•••</button>
      </div>
    </div>
    <aside id="browser-panel" class="browser-panel" aria-live="polite"></aside>
    <script>
      const address = document.querySelector('#address')
      const tabs = document.querySelector('#tabs')
      const zoom = document.querySelector('#zoom')
      const fit = document.querySelector('#fit')
      const panel = document.querySelector('#browser-panel')
      let translations = {}
      const tr = (source) => translations[source] || source
      const applyTranslations = () => {
        document.querySelectorAll('[data-i18n]').forEach((element) => { element.textContent = tr(element.dataset.i18n) })
        document.querySelectorAll('[data-i18n-title]').forEach((element) => { element.title = tr(element.dataset.i18nTitle) })
        document.querySelectorAll('[data-i18n-aria-label]').forEach((element) => { element.setAttribute('aria-label', tr(element.dataset.i18nAriaLabel)) })
      }

      const action = (name, params = {}) => {
        const query = new URLSearchParams(params).toString()
        const url = `studio-action://${name}${query ? `?${query}` : ''}`
        if (window.__embeddedBrowserToolbarIpc && window.ipc?.postMessage) {
          window.ipc.postMessage(JSON.stringify({ type: 'browser-action', url }))
          return
        }
        location.href = url
      }
      const normalizeAddress = (value) => {
        const trimmed = value.trim()
        if (!trimmed) return 'https://example.com'
        return /^https?:\/\//iu.test(trimmed) ? trimmed : `https://${trimmed}`
      }
      const renderTabs = (items = []) => {
        tabs.replaceChildren(...items.map((item) => {
          const tab = document.createElement('div')
          tab.className = `tab${item.active ? ' active' : ''}`
          tab.role = 'tab'
          tab.tabIndex = 0
          tab.setAttribute('aria-selected', String(Boolean(item.active)))
          tab.title = `${item.title}\n${item.url}`
          tab.addEventListener('click', () => action('activate-tab', { id: item.id }))
          tab.addEventListener('keydown', (event) => {
            if (event.key === 'Enter' || event.key === ' ') action('activate-tab', { id: item.id })
          })

          const title = document.createElement('span')
          title.className = 'tab-title'
          title.textContent = item.title || tr('New tab')
          const close = document.createElement('button')
          close.className = 'tab-close'
          close.type = 'button'
          close.textContent = '×'
          close.title = tr('Close tab (Ctrl+W)')
          close.addEventListener('click', (event) => {
            event.stopPropagation()
            action('close-tab', { id: item.id })
          })
          tab.append(title, close)
          return tab
        }))
        tabs.querySelector('.active')?.scrollIntoView({ block: 'nearest', inline: 'nearest' })
      }

      address.addEventListener('keydown', (event) => {
        if (event.key !== 'Enter') return
        address.value = normalizeAddress(address.value)
        action('navigate', { url: address.value })
      })
      document.querySelectorAll('[data-action]').forEach((button) => button.addEventListener('click', () => action(button.dataset.action)))
      document.querySelector('#comment').addEventListener('click', () => action('comment-selection'))
      document.addEventListener('keydown', (event) => {
        if (!(event.ctrlKey || event.metaKey) || event.altKey) return
        const key = event.key.toLowerCase()
        if (key === 't' && !event.shiftKey) action('new-tab')
        else if (key === 'w' && !event.shiftKey) document.querySelector('.tab.active .tab-close')?.click()
        else if (key === 'tab') action(event.shiftKey ? 'previous-tab' : 'next-tab')
        else return
        event.preventDefault()
      })
      window.__embeddedBrowserToolbar = {
        setState(value) {
          const typography = value?.typography
          if (typography) {
            const root = document.documentElement.style
            root.setProperty('--ui-font-family', typography.fontFamily)
            root.setProperty('--ui-font-size', `${typography.fontSize}px`)
            root.setProperty('--ui-font-weight', typography.fontWeight)
            root.setProperty('--ui-font-emphasis', Math.min(700, typography.fontWeight + 100))
          }
          translations = value?.translations || {}
          applyTranslations()
          renderTabs(value?.tabs)
          if (value?.url && document.activeElement !== address) address.value = value.url
          zoom.textContent = `${value?.zoomPercent || 100}%`
          fit.classList.toggle('active', Boolean(value?.fitWidth))
          document.title = value?.title || 'Browser'
        },
        showPanel(kind) {
          if (kind !== 'menu') return
          panel.replaceChildren()
          const make = (label, name) => {
            const button = document.createElement('button')
            button.type = 'button'
            button.textContent = label
            button.addEventListener('click', () => { panel.classList.remove('open'); action(name) })
            return button
          }
          panel.append(
            make(tr('Browser information'), 'browser-info'),
            make(tr('Downloads'), 'browser-downloads'),
            make(tr('Open downloads folder'), 'open-downloads-directory'),
            document.createElement('hr'),
            make(tr('Exit browser'), 'exit-browser'),
          )
          panel.classList.add('open')
        },
        showInfo(value) {
          const rows = [
            ['WebView2 Profile', value?.profile], ['Cache', value?.cache], ['Downloads', value?.downloads],
            ['Engine', value?.engine], ['TLS', value?.tls],
          ]
          panel.replaceChildren()
          const heading = document.createElement('h2')
          heading.textContent = tr('Browser information')
          panel.append(heading)
          for (const [label, content] of rows) {
            const line = document.createElement('p')
            line.textContent = `${label}: ${content || '—'}`
            panel.append(line)
          }
          panel.classList.add('open')
        },
        showDownloads(items) {
          panel.replaceChildren()
          const heading = document.createElement('h2')
          heading.textContent = tr('Downloads')
          panel.append(heading)
          if (!items?.length) {
            const empty = document.createElement('p')
            empty.textContent = tr('No downloads yet')
            panel.append(empty)
          } else for (const item of items) {
            const row = document.createElement('div')
            row.className = 'download-item'
            const name = document.createElement('strong')
            name.textContent = item.name || 'download'
            const detail = document.createElement('span')
            detail.textContent = `${item.state || ''} · ${item.path || ''}`
            row.append(name, detail)
            panel.append(row)
          }
          const open = document.createElement('button')
          open.type = 'button'
          open.textContent = tr('Open downloads folder')
          open.addEventListener('click', () => action('open-downloads-directory'))
          panel.append(document.createElement('hr'), open)
          panel.classList.add('open')
        },
      }
    </script>
  </body>
</html>
