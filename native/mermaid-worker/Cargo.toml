[package]
name = "codex-thread-studio-mermaid"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
publish = false
description = "Isolated native Mermaid SVG worker for Codex Thread Studio GNOME"

[workspace]

[dependencies]
merman = { version = "=0.9.3", default-features = false, features = ["all-diagrams", "complete-svg-elk", "system-fonts"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
roxmltree = "=0.21.2"
layout-svg = { package = "usvg", version = "=0.47.0", default-features = false, features = ["text"] }
libc = "0.2"
simplecss = "=0.2.2"
html5ever = "=0.40.1"

[dev-dependencies]
merman-render = { version = "=0.9.3", default-features = false }

[patch.crates-io]
merman-render = { path = "vendor/merman-render" }
merman-export = { path = "vendor/merman-export" }
usvg = { path = "vendor/usvg" }

[profile.dev]
debug = 0

[profile.release]
strip = true
