[package]
name = "studio-native-mermaid-paint-eval"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false
description = "Isolated evaluation of scoped native formula paint in pinned Merman"

[workspace]

[[bin]]
name = "studio-native-mermaid-paint-eval"
path = "../src/main.rs"

[dependencies]
merman = { version = "=0.9.3", default-features = false, features = ["all-diagrams", "complete-svg-elk", "system-fonts"] }
resvg = { version = "0.48.1", default-features = false, features = ["text", "system-fonts", "memmap-fonts"] }
serde_json = "1"
roxmltree = "=0.21.2"
layout-svg = { package = "usvg", version = "=0.47.0", default-features = false, features = ["text"] }

[dev-dependencies]
merman-render = { version = "=0.9.3", default-features = false }

[patch.crates-io]
merman-render = { path = "vendor/merman-render" }

[profile.dev]
debug = 0

[profile.release]
strip = true
