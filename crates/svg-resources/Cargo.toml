[package]
name = "studio-svg-resources"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
description = "Bounded embedded bitmap resources for native SVG rendering"

[dependencies]
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
resvg = { version = "=0.48.1", default-features = false, features = ["raster-images"] }

[dev-dependencies]
base64 = "0.23.1"
