[package]
name = "marknoria"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false
autobins = false

[dependencies]
axum = "=0.8.9"
libc = "0.2.174"
pulldown-cmark = { version = "=0.13.5", default-features = false, features = ["html", "simd"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
similar = { version = "=3.2.0", default-features = false, features = ["std", "text"] }
same-file = "=1.0.6"
syntect = { version = "=5.3.0", default-features = false, features = ["default-fancy"] }
tempfile = "=3.27.0"
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread", "net", "signal", "time"] }
tower = { version = "=0.5.3", features = ["util"] }
tungstenite = { version = "=0.29.0", default-features = false, features = ["handshake"] }
uuid = { version = "1.23.5", features = ["v4"] }
