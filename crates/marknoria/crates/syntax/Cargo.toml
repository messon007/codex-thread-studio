[package]
name = "marknoria-syntax"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false
[features]
default = ["full"]
full = ["cobol", "d", "hlsl", "fsharp", "ocaml", "idris", "odin", "c-sharp", "perl", "ruby", "elixir", "vb", "php"]
reduced = []
cobol = ["dep:arborium-cobol"]
d = ["dep:arborium-d"]
hlsl = ["dep:arborium-hlsl"]
fsharp = ["dep:arborium-fsharp"]
ocaml = ["dep:arborium-ocaml"]
idris = ["dep:arborium-idris"]
odin = ["dep:arborium-odin"]
c-sharp = ["dep:arborium-c-sharp"]
perl = ["dep:arborium-perl"]
ruby = ["dep:arborium-ruby"]
elixir = ["dep:arborium-elixir"]
vb = ["dep:arborium-vb"]
php = ["dep:arborium-php"]

[dependencies]
tree-sitter-highlight = "=0.27.1"
