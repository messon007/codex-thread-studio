    <text x="0" y="42" font-size="23" font-weight="780" letter-spacing="-.4">Document Viewer 目录</text><line x1="0" y1="59" x2="318" y2="59" stroke="#d5dee2"/>
    <text x="0" y="91" class="muted" font-size="10.5">为结构化文档提供统一、稳定的章节导航。</text><text x="0" y="113" class="muted" font-size="10.5">目录跟随阅读位置，并在不同视图中定位同一章节。</text>
    <text x="0" y="166" font-size="17" font-weight="750">3. UI 结构</text>
    <rect x="-10" y="185" width="338" height="120" rx="9" fill="#f4faf8" stroke="#c6e5dc"/><rect x="-10" y="185" width="3" height="120" rx="1.5" fill="#16856b"/>
    <text x="8" y="215" class="brand" font-size="13" font-weight="750">3.1 入口</text><text x="8" y="244" class="muted" font-size="10">Document Header 最左侧增加目录图标。</text><text x="8" y="268" class="muted" font-size="10">按钮与刷新、关闭使用相同的 32 × 32 px 几何。</text><text x="8" y="292" class="muted" font-size="10">无目录时入口完全隐藏。</text>
    <text x="0" y="353" font-size="13" font-weight="750">3.2 目录面板</text><text x="0" y="383" class="muted" font-size="10.5">目录位于文档画布内部，不创建新的共享右栏。</text><text x="0" y="407" class="muted" font-size="10.5">当前章节以品牌色指示条和浅色背景标识。</text>
    <text x="0" y="463" font-size="13" font-weight="750">3.3 宽屏与窄屏</text><text x="0" y="493" class="muted" font-size="10.5">宽屏停靠，窄屏覆盖；二者都不改动用户拖拽宽度。</text>
    <rect x="0" y="535" width="318" height="92" rx="10" fill="#f8fafb" stroke="#d5dee2"/><text x="16" y="562" class="faint" font-size="8" font-weight="700" letter-spacing="1">JUMP BEHAVIOR</text><text x="16" y="590" class="mono" font-size="9" fill="#33464f">Outline item → Provider target → Exact section</text><text x="16" y="611" class="faint" font-size="8">Preview · Source · Edit · EPUB · PDF</text>
