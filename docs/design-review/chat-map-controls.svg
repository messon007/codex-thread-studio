<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1510" viewBox="0 0 1280 1510">
<defs>
 <style>text{font-family:'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#243536;font-size:16px} .muted{fill:#6b7b7c;font-size:14px}.title{font-size:25px;font-weight:600}.label{font-weight:600}.small{font-size:13px}.stroke{fill:none;stroke:#526e6b;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}</style>
 <g id="down" class="stroke"><path d="m0 0 5 5 5-5"/></g>
