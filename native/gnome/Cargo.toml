[package]
name = "codex-thread-studio-gnome"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
license = "MIT"
description = "Native GTK4/libadwaita frontend for Codex Thread Studio"

# Keep GTK4 out of the Tauri/GTK3 dependency graph and existing platform builds.
[workspace]

[dependencies]
ammonia = "=4.2.4"
html5gum = "=0.8.4"
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
getrandom = "0.4.3"
libc = "0.2"
sse-stream = "=0.3.0"
lru = "0.19.0"
regex = "1.13"
ratex-parser = "=0.1.15"
ratex-layout = "=0.1.15"
ratex-types = "=0.1.15"
ratex-svg = { version = "=0.1.15", features = ["embed-fonts"] }
async-channel = "2.5"
futures-util = "0.3.31"
studio-markdown-native = { path = "../../crates/markdown-native", features = ["syntax-highlight", "structured-preview"] }
studio-svg-resources = { path = "../../crates/svg-resources" }
rquickjs = { version = "0.14.0", default-features = false }
# Use the renderer's standard font mapping instead of repeatedly copying large
# system/CJK font files into the diagram worker's heap.
resvg = { version = "0.48.1", default-features = false, features = ["text", "system-fonts", "memmap-fonts"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "stream", "native-tls-no-alpn"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
sha2 = "=0.11.1"
svgtypes = "=0.16.1"
ttf-parser = "=0.25.1"
tokio = { version = "1.53.3", features = ["io-util", "net", "process", "rt-multi-thread", "sync", "time", "macros"] }
tokio-tungstenite = "0.29"
url = "2.5"
percent-encoding = "2.3"
pulldown-cmark = { version = "0.13.6", default-features = false, features = ["simd"] }
tempfile = "3"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = { package = "gtk4", version = "0.11.5", features = ["v4_14"] }
adw = { package = "libadwaita", version = "0.9.2", features = ["v1_7"] }
sourceview = { package = "sourceview5", version = "0.11.2", features = ["v5_6"] }
vte = { package = "vte4", version = "0.10.0", features = ["v0_76"] }
webkit6 = "=0.6.1"
ssip-client = "=0.10.2"

[profile.dev]
debug = 0

# Retain application development settings while optimizing per-pixel loops in
# the shared SVG rasterizer. These kernels also serve math and Mermaid.
[profile.dev.package.resvg]
opt-level = 3

[profile.dev.package.tiny-skia]
opt-level = 3

[profile.dev.package.tiny-skia-path]
opt-level = 3

# Match the shared workspace's syntax-engine kernels. Debug UI behavior stays
# unchanged; cold TypeScript regex compilation otherwise exceeds color budgets.
[profile.dev.package.syntect]
opt-level = 3
[profile.dev.package.two-face]
opt-level = 3
[profile.dev.package.onig]
opt-level = 3
[profile.dev.package.onig_sys]
opt-level = 3
[profile.dev.package.fancy-regex]
opt-level = 3
[profile.dev.package.regex]
opt-level = 3
[profile.dev.package.regex-syntax]
opt-level = 3
[profile.dev.package.regex-automata]
opt-level = 3

[profile.release]
strip = true
lto = "thin"
