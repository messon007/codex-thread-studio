name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install UI development dependencies
        run: npm ci --ignore-scripts

      - name: Check vendored Markdown assets
        run: |
          npm run vendor:markdown
          git diff --exit-code -- ui/vendor

      - name: Check browser JavaScript
        run: |
          node --check ui/app.js
          npm test

      - name: Check version metadata
        run: npm run version:check

      - name: Audit UI dependencies
        if: runner.os == 'Linux'
        run: npm audit --audit-level=moderate

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Test
        run: cargo test --workspace --locked
