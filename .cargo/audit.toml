# Treat every newly reported RustSec warning as a CI failure. These advisories are the reviewed
# baseline in the current Tauri 2.0/WebKitGTK dependency graph; remove entries as upgrades eliminate
# them rather than adding new ignores without investigation.
[advisories]
informational_warnings = ["unmaintained", "unsound"]
ignore = [
  # gtk-rs GTK3 bindings retained by the current Linux Tauri/WebKitGTK stack.
  "RUSTSEC-2024-0411",
  "RUSTSEC-2024-0412",
  "RUSTSEC-2024-0413",
  "RUSTSEC-2024-0414",
  "RUSTSEC-2024-0415",
  "RUSTSEC-2024-0416",
  "RUSTSEC-2024-0417",
  "RUSTSEC-2024-0418",
  "RUSTSEC-2024-0419",
  "RUSTSEC-2024-0420",

  # Other reviewed transitive warnings in the current locked dependency graph.
  "RUSTSEC-2024-0370",
  "RUSTSEC-2024-0384",
  "RUSTSEC-2024-0429",
  "RUSTSEC-2025-0057",
  "RUSTSEC-2025-0075",
  "RUSTSEC-2025-0080",
  "RUSTSEC-2025-0081",
  "RUSTSEC-2025-0098",
  "RUSTSEC-2025-0100",
  "RUSTSEC-2026-0097",
]

[output]
deny = ["warnings"]
format = "terminal"
quiet = false
show_tree = true
