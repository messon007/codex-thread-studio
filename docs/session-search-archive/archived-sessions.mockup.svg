    <rect x="485" y="254" width="920" height="206" rx="12" fill="#fff" stroke="#e1e7e9"/><circle cx="512" cy="280" r="10" fill="#73838a"/><text x="512" y="284" text-anchor="middle" class="ui tiny" fill="#fff">CX</text><text x="535" y="278" class="ui tiny muted">ASSISTANT · AUG 15</text><text x="535" y="310" class="ui body">The maintainable architecture keeps platform-specific browser runtimes behind</text><text x="535" y="335" class="ui body">one shared workspace contract. Linux uses the Wayland runtime, while Windows</text><text x="535" y="360" class="ui body">uses WebView2 without vendoring WRY into the repository.</text>
