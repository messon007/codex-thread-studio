  <title id="title">Codex Thread Studio Document Viewer 目录 UI 草图</title>
  <desc id="desc">三栏桌面应用，右侧 Document Viewer 打开 Markdown 文档，并在文档内部显示可筛选、可跳转、同步当前章节的目录。</desc>
