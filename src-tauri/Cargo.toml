[package]
name = "codex-thread-studio"
version = "0.2.0"
edition = "2021"
license = "MIT"
default-run = "codex-thread-studio"

[[bin]]
name = "wayland-webview-prototype"
path = "src/bin/wayland-webview_prototype.rs"
required-features = ["wayland-webview-prototype"]

[features]
wayland-webview-prototype = []
windows-native = ["windows-sys/Win32_Security", "windows-sys/Win32_System_JobObjects", "windows-sys/Win32_System_Threading"]

[build-dependencies]
sha2 = "=0.10.9"
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
notify = "8.2.0"
axum = { version = "0.8.4", features = ["ws"] }
dirs = "6.0.0"
futures-util = "0.3.31"
libc = "0.2.174"
portable-pty = "0.9.0"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "stream"] }
# Preserve checked u64/usize conversions used by persisted revisions/counts.
rusqlite = { version = "0.40.2", features = ["bundled", "fallible_uint"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "=1.0.151"
tauri = { version = "2.0.0", features = ["unstable"] }
tokio = { version = "1.46.1", features = ["io-util", "net", "process", "rt-multi-thread", "sync", "time"] }
uuid = { version = "1.23.5", features = ["v4"] }
url = "2.5.8"
zip = { version = "=8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18.2"
tao = "0.35.3"
webkit2gtk = "2.0.1"
wry = "0.51.2"

[target.'cfg(windows)'.dependencies]
tao = "0.35.3"
webview2-com = "0.37"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_DataExchange", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Ole", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
wry = "0.51.2"

[dev-dependencies]
tower = { version = "0.5.2", features = ["util"] }
