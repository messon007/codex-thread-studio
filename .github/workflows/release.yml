name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils
      - name: Install UI and release tooling
        run: npm ci --ignore-scripts
      - name: Verify tag, package, lockfile, and changelog versions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: npm run version:check
      - name: Run browser tests
        run: |
          npm run typecheck
          npm test
      - name: Run Rust tests
        run: cargo test --workspace --locked

  publish:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ""
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - name: Install Linux bundle dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils
      - name: Install UI and release tooling
        run: npm ci --ignore-scripts
      # Optional Developer ID signing and notarization. The secrets are exported only when they
      # exist, because Tauri treats a present-but-empty APPLE_* variable as configured.
      - name: Configure macOS signing and notarization
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          set -eu

          if [ -n "${APPLE_CERTIFICATE:-}" ] || [ -n "${APPLE_CERTIFICATE_PASSWORD:-}" ] || [ -n "${APPLE_SIGNING_IDENTITY:-}" ]; then
            if [ -z "${APPLE_CERTIFICATE:-}" ] || [ -z "${APPLE_CERTIFICATE_PASSWORD:-}" ] || [ -z "${APPLE_SIGNING_IDENTITY:-}" ]; then
              echo "::error::Set APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, and APPLE_SIGNING_IDENTITY together, or omit all three."
              exit 1
            fi
          fi

          if [ -n "${APPLE_ID:-}" ] || [ -n "${APPLE_PASSWORD:-}" ] || [ -n "${APPLE_TEAM_ID:-}" ]; then
            if [ -z "${APPLE_ID:-}" ] || [ -z "${APPLE_PASSWORD:-}" ] || [ -z "${APPLE_TEAM_ID:-}" ]; then
              echo "::error::Set APPLE_ID, APPLE_PASSWORD, and APPLE_TEAM_ID together, or omit all three."
              exit 1
            fi
          fi

          if [ -n "${APPLE_API_KEY:-}" ] || [ -n "${APPLE_API_ISSUER:-}" ] || [ -n "${APPLE_API_KEY_P8_BASE64:-}" ]; then
            if [ -z "${APPLE_API_KEY:-}" ] || [ -z "${APPLE_API_ISSUER:-}" ] || [ -z "${APPLE_API_KEY_P8_BASE64:-}" ]; then
              echo "::error::Set APPLE_API_KEY, APPLE_API_ISSUER, and APPLE_API_KEY_P8_BASE64 together, or omit all three."
              exit 1
            fi
          fi

          if [ -z "${APPLE_CERTIFICATE:-}" ]; then
            if [ -n "${APPLE_ID:-}" ] || [ -n "${APPLE_API_KEY:-}" ]; then
              echo "::error::Notarization credentials require a Developer ID certificate."
              exit 1
            fi
            echo "::notice::macOS signing credentials are absent; bundles stay ad-hoc signed and browser downloads remain quarantined."
            exit 0
          fi

          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID APPLE_API_KEY APPLE_API_ISSUER; do
            value="${!name:-}"
            if [ -n "$value" ]; then
              printf '%s=%s\n' "$name" "$value" >> "$GITHUB_ENV"
            fi
          done

          if [ -n "${APPLE_API_KEY:-}" ]; then
            api_key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
            umask 077
            printf '%s' "$APPLE_API_KEY_P8_BASE64" | openssl base64 -d -A -out "$api_key_path"
            if [ ! -s "$api_key_path" ]; then
              echo "::error::APPLE_API_KEY_P8_BASE64 did not decode to a private key file."
              exit 1
            fi
            printf 'APPLE_API_KEY_PATH=%s\n' "$api_key_path" >> "$GITHUB_ENV"
          fi

          if [ -n "${APPLE_ID:-}" ] || [ -n "${APPLE_API_KEY:-}" ]; then
            echo "::notice::Signing and notarizing macOS bundles."
          else
            echo "::warning::Signing without notarization; macOS downloads stay quarantined until notary credentials are added."
          fi
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Codex Thread Studio v__VERSION__"
          releaseBody: |
            Desktop bundles for Linux, macOS (Apple Silicon and Intel), and Windows 11. Studio uses the Codex and OpenCode CLIs you already have installed and stores no model credentials.

            ### macOS first launch

            If macOS reports the app as damaged or from an unidentified developer, remove the download quarantine attribute once, before the first launch:

            ```bash
            xattr -dr com.apple.quarantine "/Applications/Codex Thread Studio.app"
            ```

            Installing the `curl` bundle avoids the attribute entirely. Details: [macOS troubleshooting](https://github.com/messon007/codex-thread-studio/blob/${{ github.ref_name }}/docs/troubleshooting.md#macos-says-the-app-is-damaged-or-cannot-be-verified).

            Changes: [CHANGELOG.md](https://github.com/messon007/codex-thread-studio/blob/${{ github.ref_name }}/CHANGELOG.md).
          releaseDraft: true
          prerelease: false
          generateReleaseNotes: true
          uploadUpdaterJson: false
          args: ${{ matrix.args }}
